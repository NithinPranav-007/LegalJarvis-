name: LegalJarvis CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Bandit Security Scanner
        run: |
          bandit -r backend/app -ll

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legaljarvis
          POSTGRES_PASSWORD: legaljarvis_dev_pass
          POSTGRES_DB: legaljarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://legaljarvis:legaljarvis_dev_pass@localhost:5432/legaljarvis
          SYNC_DATABASE_URL: postgresql://legaljarvis:legaljarvis_dev_pass@localhost:5432/legaljarvis
          JWT_SECRET: test_ci_secret_key_never_used_in_prod_123456789
          LLM_PROVIDER: fake
        run: |
          pytest backend/tests -v --cov=backend/app

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript typecheck & Build
        working-directory: ./frontend
        run: npm run build
