[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legaljarvis-backend"
version = "0.1.0"
description = "Backend API and NLP pipeline for LegalJarvis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LegalJarvis Engineering Team", email = "engineering@legaljarvis.local" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "pyyaml>=6.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.10.3",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.5.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.2"
]

[project.scripts]
ljarvis = "app.ingest.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-p no:langsmith"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
